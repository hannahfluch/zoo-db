services:
  db:
    build: .
    environment:
      POSTGRES_DB: zoo
      POSTGRES_USER: zoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zoo_local_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zoo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoo -d zoo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    build: ./mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: zoo
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-zoo_mongo_local_password}
      MONGO_INITDB_DATABASE: zoo
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - zoo_mongo_data:/data/db
      - zoo_mongo_config:/data/configdb
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'if (db.adminCommand({ping: 1}).ok !== 1) quit(1)'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    environment:
      PGHOST: db
      PGDATABASE: zoo
      PGUSER: zoo
      PGPASSWORD: ${POSTGRES_PASSWORD:-zoo_local_password}
      MONGO_URL: mongodb://mongo:27017/zoo?directConnection=true
      MONGO_PASSWORD: ${MONGO_PASSWORD:-zoo_mongo_local_password}
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/api/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s

  data:
    build: ./frontends/data
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DATA_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zoo_data:
  zoo_mongo_data:
  zoo_mongo_config:
