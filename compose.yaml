services:
  db:
    build: .
    environment:
      POSTGRES_DB: zoo
      POSTGRES_USER: zoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zoo_local_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zoo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoo -d zoo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  zoo_data:
